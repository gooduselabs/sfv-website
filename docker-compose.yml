# SFV — full stack: PostgreSQL + Directus 11 + init (schema/roles/seed) + Next.js web
#   cp .env.example .env && docker compose up --build
#   web http://localhost:3000 · admin http://localhost:8055/admin
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: sfv, POSTGRES_PASSWORD: "${DB_PASSWORD:-sfv}", POSTGRES_DB: sfv }
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sfv"], interval: 3s, retries: 30 }
  directus:
    image: directus/directus:11.17.4
    depends_on: { db: { condition: service_healthy } }
    ports: ["8055:8055"]
    environment:
      SECRET: "${DIRECTUS_SECRET:?set DIRECTUS_SECRET in .env}"
      PUBLIC_URL: http://localhost:8055
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sfv
      DB_USER: sfv
      DB_PASSWORD: "${DB_PASSWORD:-sfv}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@sfv.org.vn}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"
      MIGRATIONS_PATH: /directus/migrations
      TELEMETRY: "false"
    volumes:
      - uploads:/directus/uploads
      - ./cms/extensions:/directus/extensions
      - ./cms/migrations:/directus/migrations
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8055/server/ping || exit 1"], interval: 5s, retries: 30 }
  cms-init:
    build: { context: ./cms, dockerfile: Dockerfile.init }
    depends_on: { directus: { condition: service_healthy } }
    environment:
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@sfv.org.vn}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DEMO_USER_PASSWORD: "${DEMO_USER_PASSWORD:-}"
      SKIP_SCHEMA: "1"   # schema via REST (setup-schema.mjs) below; snapshot apply needs DB env
    command: ["sh", "-c", "node scripts/setup-schema.mjs && SKIP_SCHEMA=1 sh scripts/init.sh"]
    restart: "no"
  web:
    build: { context: ./web, args: { NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8055, DIRECTUS_URL: http://directus:8055 } }
    depends_on: { cms-init: { condition: service_completed_successfully } }
    environment: { DIRECTUS_URL: http://directus:8055, NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8055 }
    ports: ["3000:3000"]
volumes: { db: {}, uploads: {} }
