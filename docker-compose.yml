# SFV — PostgreSQL + Directus 11 + one-shot init (schema/roles/seed) + Next.js web
#   cp .env.example .env  (set secrets + PUBLIC_HOST)  &&  docker compose up -d --build
#   web http://<PUBLIC_HOST>:${WEB_PORT:-3000} · admin http://<PUBLIC_HOST>:${CMS_PORT:-8055}/admin
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: sfv, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}", POSTGRES_DB: sfv }
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sfv"], interval: 3s, retries: 30 }
  directus:
    image: directus/directus:11.17.4
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports: ["0.0.0.0:${CMS_PORT:-8055}:8055"]
    environment:
      SECRET: "${DIRECTUS_SECRET:?set DIRECTUS_SECRET in .env}"
      PUBLIC_URL: "http://${PUBLIC_HOST:-localhost}:${CMS_PORT:-8055}"
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sfv
      DB_USER: sfv
      DB_PASSWORD: "${DB_PASSWORD}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@sfv.org.vn}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      MIGRATIONS_PATH: /directus/migrations
      EXTENSIONS_AUTO_RELOAD: "false"
      TELEMETRY: "false"
    volumes:
      - uploads:/directus/uploads
      - ./cms/extensions:/directus/extensions
      - ./cms/migrations:/directus/migrations
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/ping || exit 1"], interval: 5s, retries: 60, start_period: 20s }
  cms-init:
    build: { context: ./cms, dockerfile: Dockerfile.init }
    depends_on: { directus: { condition: service_healthy } }
    environment:
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@sfv.org.vn}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DEMO_USER_PASSWORD: "${DEMO_USER_PASSWORD:-}"
      SEED_IF_EMPTY: "1"   # demo seed only on an empty DB; never wipes edited content
    command: ["sh", "-c", "node scripts/setup-schema.mjs && SKIP_SCHEMA=1 sh scripts/init.sh"]
    restart: "no"
  db-indexes:
    image: postgres:17-alpine
    depends_on: { cms-init: { condition: service_completed_successfully } }
    environment: { PGPASSWORD: "${DB_PASSWORD}" }
    command: ["psql", "-h", "db", "-U", "sfv", "-d", "sfv", "-v", "ON_ERROR_STOP=1", "-c",
      "CREATE INDEX IF NOT EXISTS results_event_idx ON results(event); CREATE INDEX IF NOT EXISTS results_athlete_idx ON results(athlete); CREATE INDEX IF NOT EXISTS competition_events_comp_idx ON competition_events(competition);"]
    restart: "no"
  web:
    build:
      context: ./web
      args: { NEXT_PUBLIC_DIRECTUS_URL: "http://${PUBLIC_HOST:-localhost}:${CMS_PORT:-8055}" }
    restart: unless-stopped
    depends_on: { db-indexes: { condition: service_completed_successfully } }
    environment: { DIRECTUS_URL: http://directus:8055 }
    ports: ["0.0.0.0:${WEB_PORT:-3000}:3000"]
volumes: { db: {}, uploads: {} }
